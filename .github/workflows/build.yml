name: Build Minecraft MCPE S905 ARM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-arm-32bit:
    runs-on: ubuntu-latest
    
    name: ARM S905 32-bit Cross-Compile

    steps:
    - uses: actions/checkout@v4

    - name: Install ARM 32-bit cross-compile toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc-arm-linux-gnueabihf \
          g++-arm-linux-gnueabihf \
          binutils-arm-linux-gnueabihf

    - name: Build 32-bit static binary
      run: |
        mkdir -p build-armv7
        cd build-armv7
        arm-linux-gnueabihf-g++ -std=c++11 -O2 -static \
          -I../handheld/src \
          ../handheld/src/main_emuelec_s905.h \
          -o minecraft_s905_armv7 \
          -lm

    - name: Verify 32-bit artifact
      run: |
        file build-armv7/minecraft_s905_armv7
        arm-linux-gnueabihf-readelf -h build-armv7/minecraft_s905_armv7
        ldd build-armv7/minecraft_s905_armv7 || echo "Statically linked"

    - name: Upload 32-bit artifact
      uses: actions/upload-artifact@v4
      with:
        name: minecraft_s905_armv7-${{ github.sha }}
        path: build-armv7/minecraft_s905_armv7
        retention-days: 30

  build-arm-64bit:
    runs-on: ubuntu-latest
    
    name: ARM S905X 64-bit Cross-Compile

    steps:
    - uses: actions/checkout@v4

    - name: Install ARM 64-bit cross-compile toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu

    - name: Build 64-bit static binary
      run: |
        mkdir -p build-aarch64
        cd build-aarch64
        aarch64-linux-gnu-g++ -std=c++11 -O2 -static \
          -I../handheld/src \
          ../handheld/src/main_emuelec_s905.h \
          -o minecraft_s905_aarch64 \
          -lm

    - name: Verify 64-bit artifact
      run: |
        file build-aarch64/minecraft_s905_aarch64
        aarch64-linux-gnu-readelf -h build-aarch64/minecraft_s905_aarch64
        ldd build-aarch64/minecraft_s905_aarch64 || echo "Statically linked"

    - name: Upload 64-bit artifact
      uses: actions/upload-artifact@v4
      with:
        name: minecraft_s905_aarch64-${{ github.sha }}
        path: build-aarch64/minecraft_s905_aarch64
        retention-days: 30

  release:
    needs: [build-arm-32bit, build-arm-64bit]
    runs-on: ubuntu-latest
    
    name: Create Release

    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          minecraft_s905_armv7-${{ github.sha }}/minecraft_s905_armv7
          minecraft_s905_aarch64-${{ github.sha }}/minecraft_s905_aarch64
        body: "Minecraft Pi Edition - EmuELEC S905 Mali GPU Port\n\n**Binaries** (Statically Linked):\n- minecraft_s905_armv7 (ARM v7, 32-bit)\n- minecraft_s905_aarch64 (ARM64, 64-bit)\n\nBoth binaries are fully static with no external library dependencies.\n\nSee README_EMUELEC_S905.md for installation and usage instructions."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
